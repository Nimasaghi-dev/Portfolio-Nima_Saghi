<svg width="480" height="480" viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141417"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#212124" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/>
  <rect width="480" height="480" fill="url(#grid)"/>
  <rect width="480" height="480" fill="url(#glow)"/>
  <!-- shoulders + head silhouette -->
  <g fill="#26262b">
    <circle cx="240" cy="190" r="82"/>
    <path d="M110 430c0-72 58-130 130-130s130 58 130 130v50H110z"/>
  </g>
  <!-- accent monogram -->
  <text x="240" y="250" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="120" font-weight="700" fill="#3b82f6" opacity="0.9">NS</text>
  <rect x="1" y="1" width="478" height="478" fill="none" stroke="#212124" stroke-width="2"/>
</svg>
